apiVersion: v1
kind: ConfigMap
metadata:
  name: voting-app-config
  namespace: voting-app
data:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  VOTE_QUEUE_KEY: "votes"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "votingdb"
  POSTGRES_USER: "voting_user"
  BRPOP_TIMEOUT_SECS: "5"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: voting-app
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS votes (
        candidate   VARCHAR(20) PRIMARY KEY
                    CHECK (candidate IN ('cricket', 'football')),
        vote_count  BIGINT NOT NULL DEFAULT 0
                    CHECK (vote_count >= 0),
        updated_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    INSERT INTO votes (candidate, vote_count)
    VALUES ('cricket', 0), ('football', 0)
    ON CONFLICT (candidate) DO NOTHING;

    CREATE OR REPLACE VIEW vote_results AS
    SELECT candidate,
           vote_count,
           ROUND(100.0 * vote_count / NULLIF(SUM(vote_count) OVER (), 0), 2) AS pct_share,
           updated_at
    FROM votes
    ORDER BY vote_count DESC;
