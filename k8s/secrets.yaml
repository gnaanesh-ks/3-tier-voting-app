# =============================================================================
# IMPORTANT: For a real GitOps repo, do NOT commit plaintext or even base64
# Secrets like the one below - base64 is not encryption. Use one of:
#   (a) Sealed Secrets (bitnami-labs/sealed-secrets) - encrypt client-side,
#       commit the SealedSecret CRD safely, controller decrypts in-cluster.
#   (b) External Secrets Operator + Azure Key Vault (recommended for AKS) -
#       secrets never touch Git at all; ExternalSecret just references them.
#   (c) Secrets Store CSI Driver + AWS Secrets Manager (recommended for EKS,
#       paired with IRSA) - see OPTION C below.
# Pick ONE for your environment.
# =============================================================================

# -----------------------------------------------------------------------
# OPTION A (dev/demo only - NOT for production GitOps repos):
# Plain Secret, referenced here purely to show required keys/shape.
# Apply this manually/out-of-band, never via a Git-tracked ArgoCD Application.
# -----------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: voting-app
type: Opaque
stringData:
  POSTGRES_USER: "voting_user"
  POSTGRES_PASSWORD: "REPLACE_ME_DO_NOT_COMMIT"
  POSTGRES_DB: "votingdb"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: voting-app
type: Opaque
stringData:
  REDIS_PASSWORD: "REPLACE_ME_DO_NOT_COMMIT"

---
# -----------------------------------------------------------------------
# OPTION B (recommended for production AKS + GitOps):
# SecretProviderClass pulling from Azure Key Vault via the AKS-managed
# Secrets Store CSI Driver + workload identity. This YAML IS safe to commit -
# it contains no secret material, only references.
# -----------------------------------------------------------------------
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: voting-app-akv-provider
  namespace: voting-app
spec:
  provider: azure
  secretObjects:
    - secretName: postgres-credentials
      type: Opaque
      data:
        - objectName: postgres-password
          key: POSTGRES_PASSWORD
    - secretName: redis-credentials
      type: Opaque
      data:
        - objectName: redis-password
          key: REDIS_PASSWORD
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<AKS-WORKLOAD-IDENTITY-CLIENT-ID>"      # set via ArgoCD parameter/overlay
    keyvaultName: "<YOUR-AKV-NAME>"
    tenantId: "<YOUR-AZURE-TENANT-ID>"
    objects: |
      array:
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: redis-password
          objectType: secret

---
# -----------------------------------------------------------------------
# OPTION C (recommended for production EKS + GitOps):
# SecretProviderClass pulling from AWS Secrets Manager via the
# Secrets Store CSI Driver + AWS provider. Requires the pod to run under
# the IRSA-annotated ServiceAccount (see k8s/serviceaccount.yaml) - the
# AWS provider authenticates using that ServiceAccount's assumed role.
# This YAML IS safe to commit - it contains no secret material, only
# references to secrets already stored in AWS Secrets Manager.
# -----------------------------------------------------------------------
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: voting-app-aws-secrets
  namespace: voting-app
spec:
  provider: aws
  secretObjects:
    - secretName: postgres-credentials
      type: Opaque
      data:
        - objectName: postgres-password
          key: POSTGRES_PASSWORD
    - secretName: redis-credentials
      type: Opaque
      data:
        - objectName: redis-password
          key: REDIS_PASSWORD
  parameters:
    objects: |
      - objectName: "voting-app/postgres-password"
        objectAlias: "postgres-password"
        objectType: "secretsmanager"
      - objectName: "voting-app/redis-password"
        objectAlias: "redis-password"
        objectType: "secretsmanager"
