# -----------------------------------------------------------------------
# StorageClasses backing the PVCs in redis.yaml (gp3) and postgres.yaml (io2).
# Requires the AWS EBS CSI driver add-on to be installed on the EKS cluster -
# these class names are NOT created automatically like AKS's built-in
# `managed-csi` classes.
# -----------------------------------------------------------------------
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: io2
provisioner: ebs.csi.aws.com
parameters:
  type: io2
  iops: "3000"     # provisioned IOPS; tune to workload, io2 requires this parameter
reclaimPolicy: Retain   # protect DB volumes from accidental deletion
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
